name: inbox-zero-services
services:
  db:
    image: postgres:16
    restart: always
    container_name: inbox-zero
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-inboxzero}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database-data:/var/lib/postgresql/data/
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - inbox-zero-network
    profiles:
      - local-db
      - all

  redis:
    image: redis:7
    ports:
      - ${REDIS_PORT:-6380}:6379
    volumes:
      - database-data:/data
    networks:
      - inbox-zero-network
    restart: always
    profiles:
      - local-redis
      - all

  serverless-redis-http:
    ports:
      - "${REDIS_HTTP_PORT:-8079}:80"
    image: hiett/serverless-redis-http:latest
    env_file:
      - ./apps/web/.env
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379" # Using `redis` hostname since they're in the same Docker network.
    networks:
      - inbox-zero-network
    restart: always
    profiles:
      - local-redis
      - all

  web:
    image: ghcr.io/elie222/inbox-zero:latest
    pull_policy: if_not_present
    # The pre-built image will be used by default. For local development,
    # use 'docker compose build web' to build from source instead.
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod

    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    ports:
      - ${WEB_PORT:-3001}:3000
    networks:
      - inbox-zero-network
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:password@db:5432/inboxzero?schema=public
      DIRECT_URL: postgresql://postgres:password@db:5432/inboxzero?schema=public
      UPSTASH_REDIS_URL: http://serverless-redis-http:80
      UPSTASH_REDIS_TOKEN: "${UPSTASH_REDIS_TOKEN}"
      DEFAULT_LLM_PROVIDER: ollama
      DEFAULT_LLM_MODEL: phi3:mini
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      NEXT_PUBLIC_OLLAMA_MODEL: phi3:mini
      INTERNAL_API_KEY: "dev-internal-api-key-123"
      GOOGLE_CLIENT_ID: "dummy-google-client-id"
      GOOGLE_CLIENT_SECRET: "dummy-google-client-secret"
      EMAIL_ENCRYPT_SECRET: "dummy-email-encrypt-secret"
      EMAIL_ENCRYPT_SALT: "dummy-email-encrypt-salt"
      GOOGLE_PUBSUB_TOPIC_NAME: "inbox-zero-dev-topic"
    restart: always

volumes:
  database-data:

networks:
  inbox-zero-network:
