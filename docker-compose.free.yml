name: inbox-zero-free-optimized

services:
  db:
    image: postgres:16-alpine
    container_name: inbox-zero-free-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-inboxzero}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_MAX_CONNECTIONS=15
      - POSTGRES_SHARED_BUFFERS=16MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=32MB
      - POSTGRES_WORK_MEM=512kB
    command: postgres -c max_connections=15 -c shared_buffers=16MB -c effective_cache_size=32MB -c work_mem=512kB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 20s
      timeout: 5s
      retries: 2
      start_period: 30s
    volumes:
      - free-db-data:/var/lib/postgresql/data
    ports:
      - 5435:5432
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  redis:
    image: redis:7-alpine
    container_name: inbox-zero-free-redis
    ports:
      - ${REDIS_PORT:-6381}:6379
    volumes:
      - free-redis-data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
        reservations:
          memory: 16M
          cpus: "0.05"
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "1"

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: inbox-zero-free-redis-http
    ports:
      - "${REDIS_HTTP_PORT:-8080}:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_TOKEN:-dev_token_12345}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    networks:
      - inbox-zero-free-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.05"
        reservations:
          memory: 12M
          cpus: "0.02"
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "1"

  web:
    image: ghcr.io/elie222/inbox-zero:latest
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    env_file:
      - ./apps/web/.env
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
      serverless-redis-http:
        condition: service_started
        required: false
    ports:
      - ${WEB_PORT:-3003}:3000
    environment:
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-inboxzero}?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-inboxzero}?schema=public}
      UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL:-http://serverless-redis-http:80}
      UPSTASH_REDIS_TOKEN: "${UPSTASH_REDIS_TOKEN:-dev_token_12345}"
      QSTASH_TOKEN: "${QSTASH_TOKEN:-dev_qstash_token_12345}"
      # FREE MODELS - Updated to use free models
      DEFAULT_LLM_MODEL: "tngtech/tng-r1t-chimera:free"
      DEFAULT_LLM_PROVIDER: "openrouter"
      ECONOMY_LLM_MODEL: "tngtech/tng-r1t-chimera:free"
      ECONOMY_LLM_PROVIDER: "openrouter"
      NODE_OPTIONS: "--max_old_space_size=512"
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.4"
        reservations:
          memory: 128M
          cpus: "0.15"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    tmpfs:
      - /tmp:noexec,nosuid,size=50M

volumes:
  free-db-data:
    driver: local
  free-redis-data:
    driver: local

networks:
  inbox-zero-free-network:
    driver: bridge
